name: CI — Tests + Windows EXE Build + Self-Test

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Linux tests (fast, full Tesseract available)
  # ─────────────────────────────────────────────────────────────────
  test-linux:
    name: Tests (Linux / Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tesseract + Russian language data
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-rus

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy \
            Pillow \
            opencv-python-headless \
            pytesseract \
            sounddevice \
            mss \
            pytest \
            pytest-cov

      - name: Install piper-tts (best-effort; skip on failure)
        run: pip install piper-tts || echo "piper-tts install failed — TTS tests will be skipped"

      - name: Generate synthetic test frames
        run: python test_data/generate_frames.py

      - name: Run unit + QA tests
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --ignore=tests/test_pipeline_integration.py \
            -k "not Integration" \
            --cov=gamevoice_ru \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Run integration tests (lenient, skip if OCR unavailable)
        run: |
          python -m pytest tests/test_pipeline_integration.py \
            -v --tb=short || echo "Integration tests skipped or partially failed (expected in CI)"
        continue-on-error: true

      - name: Download Piper Russian voice for Linux TTS verification
        run: |
          # QA: Download CC0-1.0 ru_RU-dmitri-medium voice so self-test TTS step
          # exercises actual synthesis instead of reporting SKIP.
          VOICE_DIR="$HOME/.gamevoice_ru/voices/ru_RU-dmitri-medium"
          mkdir -p "$VOICE_DIR"
          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/dmitri/medium"
          for f in "ru_RU-dmitri-medium.onnx" "ru_RU-dmitri-medium.onnx.json"; do
            dest="$VOICE_DIR/$f"
            if [ ! -f "$dest" ]; then
              echo "Downloading $f..."
              curl -fsSL -o "$dest" "$BASE/$f" --retry 3 --retry-delay 5 || \
                echo "WARNING: failed to download $f (TTS will be SKIP)"
            fi
          done

      - name: Run headless self-test on Linux (Tesseract + Piper)
        run: |
          python -m gamevoice_ru --self-test --output self_test_linux.json
          echo "Self-test exit code: $?"
          # QA strict check: OCR must not be SKIP on Linux (Tesseract is installed)
          python3 -c "
          import json, sys
          d = json.load(open('self_test_linux.json'))
          ocr = d['steps']['ocr']
          tts = d['steps']['tts']
          print(f'OCR engine={ocr[\"engine\"]} status={ocr[\"status\"]}')
          print(f'TTS status={tts[\"status\"]}')
          if ocr['status'] == 'SKIP':
              print('QA-STRICT-FAIL: OCR=SKIP on Linux — Tesseract should be installed', file=sys.stderr)
              sys.exit(1)
          if tts['status'] == 'SKIP':
              print('QA-WARN: TTS=SKIP on Linux — Piper voice download may have failed')
          print('QA check passed')
          " || (echo "QA strict check failed; see above"; exit 1)

      - name: Upload Linux self-test JSON
        uses: actions/upload-artifact@v4
        with:
          name: self-test-linux
          path: self_test_linux.json
          if-no-files-found: error

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────
  # Windows tests + EXE build + self-test of the EXE
  # ─────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows EXE Build + Self-Test
    runs-on: windows-latest
    needs: test-linux

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tesseract for Windows (via Chocolatey)
        shell: pwsh
        run: |
          # QA: Use choco (pre-installed on GH Actions) instead of UB-Mannheim
          # direct download, which reliably times out in CI (Finding re-verify).
          Write-Host "Installing Tesseract via Chocolatey..."
          try {
            choco install tesseract --version=5.3.3 -y --no-progress 2>&1
            # Chocolatey installs to C:\Program Files\Tesseract-OCR by default
            $tess_dir = "C:\Program Files\Tesseract-OCR"
            if (Test-Path "$tess_dir\tesseract.exe") {
              echo "$tess_dir" >> $env:GITHUB_PATH
              echo "TESSDATA_PREFIX=$tess_dir\tessdata" >> $env:GITHUB_ENV
              Write-Host "Tesseract installed OK via choco: $(& "$tess_dir\tesseract.exe" --version 2>&1 | Select-Object -First 1)"
            } else {
              Write-Host "WARNING: tesseract.exe not found after choco install"
            }
          } catch {
            Write-Host "WARNING: Tesseract choco install failed: $_"
          }

      - name: Install Russian OCR language pack for Windows OCR (WinRT)
        shell: pwsh
        run: |
          # QA: Try to install Russian OCR capability for Windows OCR API (Finding #2).
          # windows-latest runners (Windows Server 2022) support Add-WindowsCapability.
          # This enables the WindowsOCR path in the self-test; failure is non-fatal
          # since Tesseract provides fallback OCR coverage.
          Write-Host "Installing Russian OCR language capability..."
          try {
            $cap = Add-WindowsCapability -Online -Name "Language.OCR~~~ru-RU~0.0.1.0" -ErrorAction Stop
            Write-Host "Russian OCR capability: $($cap.RestartNeeded ? 'installed (restart needed)' : 'installed OK')"
          } catch {
            Write-Host "WARNING: Add-WindowsCapability failed (non-fatal): $_"
            Write-Host "Windows OCR will not be tested; Tesseract covers OCR verification."
          }

      - name: Install WinRT Python bindings for Windows OCR
        shell: pwsh
        run: |
          # QA: Install winrt packages so WindowsOCR can be exercised in --self-test.
          # Finding #2 fix code uses winrt; without these packages WindowsOCR always
          # falls through to Tesseract fallback and the fix code path never runs.
          pip install winrt-runtime 2>&1 | Select-String -Pattern "Successfully|already|ERROR" | Write-Host
          # Install individual WinRT namespace packages needed by ocr.py
          $winrt_pkgs = @(
            "winrt.windows.media.ocr",
            "winrt.windows.globalization",
            "winrt.windows.graphics.imaging",
            "winrt.windows.storage.streams"
          )
          foreach ($pkg in $winrt_pkgs) {
            pip install $pkg 2>&1 | Select-String -Pattern "Successfully|already|ERROR|not found" | Write-Host
          }
          Write-Host "WinRT package install complete (errors are non-fatal)"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          $packages = @("numpy", "Pillow", "opencv-python-headless", "pytesseract",
                        "sounddevice", "mss", "pytest", "pytest-cov")
          pip install @packages
          pip install piper-tts 2>$null || Write-Host "piper-tts optional, skipping"

      - name: Download Piper Russian voice for TTS verification
        shell: pwsh
        run: |
          # QA: Download a CC0-1.0 licensed Piper voice so TTS synthesis can be
          # verified in the self-test (not just SKIP). License: CC0-1.0 (public domain).
          # Files are ~65 MB; this is the only way to actually exercise the TTS path.
          $voice_dir = "$env:USERPROFILE\.gamevoice_ru\voices\ru_RU-dmitri-medium"
          New-Item -ItemType Directory -Force -Path $voice_dir | Out-Null
          $base_url = "https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/dmitri/medium"
          $files = @("ru_RU-dmitri-medium.onnx", "ru_RU-dmitri-medium.onnx.json")
          foreach ($f in $files) {
            $dest = "$voice_dir\$f"
            if (-not (Test-Path $dest)) {
              Write-Host "Downloading $f..."
              try {
                Invoke-WebRequest -Uri "$base_url/$f" -OutFile $dest -TimeoutSec 300 -UseBasicParsing
                Write-Host "Downloaded $f ($('{0:N0}' -f (Get-Item $dest).Length) bytes)"
              } catch {
                Write-Host "WARNING: Failed to download $f - TTS will be SKIP: $_"
              }
            }
          }

      - name: Generate synthetic test frames
        shell: pwsh
        run: python test_data/generate_frames.py

      - name: Run unit tests (Windows)
        shell: pwsh
        run: |
          python -m pytest tests/ -v --tb=short `
            --ignore=tests/test_pipeline_integration.py `
            -k "not Integration"

      - name: Run headless self-test via Python (before EXE build)
        shell: pwsh
        run: |
          python -m gamevoice_ru --self-test --output self_test_python_windows.json
          $exit_code = $LASTEXITCODE
          Write-Host "Python self-test exit code: $exit_code"
          Get-Content self_test_python_windows.json
          if ($exit_code -ne 0) {
            Write-Host "WARNING: Python self-test reported critical failures (see JSON above)"
          }
          # QA strict check: parse OCR and TTS status from JSON
          $data = Get-Content self_test_python_windows.json | ConvertFrom-Json
          $ocr_status = $data.steps.ocr.status
          $tts_status = $data.steps.tts.status
          $ocr_engine = $data.steps.ocr.engine
          Write-Host "QA: OCR engine=$ocr_engine status=$ocr_status | TTS status=$tts_status"
          if ($ocr_status -eq "SKIP") {
            Write-Host "QA-WARN: OCR=SKIP on Windows — neither Tesseract nor WindowsOCR available in this runner"
            Write-Host "         This means OCR code was NOT exercised. See QA_REPORT.md finding #A."
          } else {
            Write-Host "QA-OK: OCR ran ($ocr_engine)"
          }
          if ($tts_status -eq "SKIP") {
            Write-Host "QA-WARN: TTS=SKIP — Piper voice not downloaded or download failed"
          } else {
            Write-Host "QA-OK: TTS synthesized successfully"
          }
        continue-on-error: true

      - name: Install PyInstaller
        shell: pwsh
        run: pip install pyinstaller>=6.0

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          pyinstaller GameVoiceRU.spec --distpath dist --workpath build --noconfirm
          Write-Host "Build complete"
          if (Test-Path "dist/GameVoiceRU/GameVoiceRU.exe") {
            Write-Host "EXE found: dist/GameVoiceRU/GameVoiceRU.exe"
            Get-Item "dist/GameVoiceRU/GameVoiceRU.exe" | Select-Object Name, Length
          } else {
            Write-Host "ERROR: EXE not found after build"
            exit 1
          }

      - name: Run EXE self-test (headless smoke test of built binary)
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist\GameVoiceRU\GameVoiceRU.exe"
          $json_out = Resolve-Path "." | Join-Path -ChildPath "self_test_exe.json"
          Write-Host "Running: $exe --self-test --output $json_out"
          # Use Start-Process -Wait so PowerShell blocks until the EXE finishes.
          # & $exe would return immediately for console=False (SUBSYSTEM:WINDOWS) apps.
          $proc = Start-Process -FilePath $exe `
            -ArgumentList "--self-test", "--output", $json_out `
            -Wait -PassThru -NoNewWindow
          $exit_code = $proc.ExitCode
          Write-Host "EXE self-test exit code: $exit_code"
          if (Test-Path $json_out) {
            Get-Content $json_out
          } else {
            Write-Host "ERROR: self_test_exe.json was not created by the EXE"
            exit 1
          }
          if ($exit_code -ne 0) {
            Write-Host "ERROR: EXE self-test returned non-zero exit code $exit_code"
            exit $exit_code
          }

      - name: Zip the portable build
        shell: pwsh
        run: |
          Compress-Archive -Path dist/GameVoiceRU -DestinationPath dist/GameVoiceRU-windows-x64.zip
          Write-Host "Archive: dist/GameVoiceRU-windows-x64.zip"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameVoiceRU-windows-x64
          path: dist/GameVoiceRU-windows-x64.zip
          retention-days: 30
          if-no-files-found: error

      - name: Upload Windows self-test JSON artifacts
        uses: actions/upload-artifact@v4
        with:
          name: self-test-windows
          path: |
            self_test_python_windows.json
            self_test_exe.json
          if-no-files-found: warn
